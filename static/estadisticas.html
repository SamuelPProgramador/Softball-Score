<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estadísticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-page="estadisticas">
<div class="wrap wide">
  <div id="mainnav"></div>

  <div class="form-card">
    <label class="field-label" for="seasonSel">Temporada</label>
    <select class="input" id="seasonSel"></select>
  </div>

  <div class="section-title" style="margin-top:0">Bateo — acumulado de la temporada</div>
  <div class="table-wrap"><table id="batTable"></table></div>
  <div class="hint">Toca un jugador para ver su detalle.</div>

  <div class="section-title">Pitcheo — acumulado de la temporada</div>
  <div class="table-wrap"><table id="pitTable"></table></div>

  <div id="detail" style="display:none">
    <div class="section-title" id="detailTitle"></div>
    <div class="stat-tiles" id="detailTiles"></div>

    <div id="batLogBox">
      <div class="section-title">Bateo juego por juego</div>
      <div class="table-wrap"><table id="batLog"></table></div>
    </div>
    <div id="pitLogBox">
      <div class="section-title">Pitcheo juego por juego</div>
      <div class="table-wrap"><table id="pitLog"></table></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/nav.js"></script>
<script src="/static/js/estadisticas.js"></script>
</body>
</html>
