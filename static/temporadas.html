<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temporadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-page="temporadas">
<div class="wrap wide">
  <div id="mainnav"></div>

  <div class="form-card">
    <div class="section-title" style="margin-top:0">Nueva temporada</div>
    <label class="field-label" for="fName">Nombre</label>
    <input class="input" id="fName" type="text" maxlength="40" placeholder="Ej: Temporada 2027">
    <div class="form-actions">
      <button class="btn" id="createBtn" type="button">Crear temporada</button>
    </div>
    <div class="hint">La temporada nueva pasa a ser la activa: los juegos que crees desde ahora se guardan en ella.</div>
  </div>

  <div class="section-title">Temporadas</div>
  <div class="lineup-card" id="seasonList"></div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/nav.js"></script>
<script src="/static/js/temporadas.js"></script>
</body>
</html>
