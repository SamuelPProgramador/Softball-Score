<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-page="equipo">
<div class="wrap">
  <div id="mainnav"></div>

  <div class="form-card">
    <div class="section-title" style="margin-top:0">Mi equipo</div>
    <div class="form-grid">
      <div class="full">
        <label class="field-label" for="fName">Nombre del equipo</label>
        <input class="input" id="fName" type="text" maxlength="40" placeholder="Ej: Los Tigres">
      </div>
      <div>
        <label class="field-label" for="fColor">Color principal</label>
        <input class="input" id="fColor" type="color" value="#E0AE45" style="height:44px;padding:4px">
      </div>
      <div>
        <label class="field-label" for="fLogo">Logo</label>
        <input class="input" id="fLogo" type="file" accept="image/png,image/jpeg,image/webp">
      </div>
      <div class="full logo-row">
        <img class="logo-prev" id="logoPrev" alt="Logo" style="display:none">
        <button class="btn-link danger" id="rmLogo" type="button" style="display:none">Quitar logo</button>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" id="saveBtn" type="button">Guardar</button>
    </div>
    <div class="hint">El nombre y el logo aparecen en el menú, el partido en vivo y la hoja de resultados. El color se usa como acento en todo el sistema. El logo se reduce automáticamente.</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/js/nav.js"></script>
<script src="/static/js/img.js"></script>
<script src="/static/js/equipo.js"></script>
</body>
</html>
